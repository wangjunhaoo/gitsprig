[package]
name = "gitgui"
version = "0.1.0"
description = "轻量独立 Git 客户端"
authors = ["GitGUI"]
license = "MIT"
readme = "../README.md"
edition = "2021"
default-run = "gitgui"

[lib]
name = "gitgui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
notify = "8"
libc = "0.2"
similar = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream", "system-proxy"] }
tokio = { version = "1", features = ["time", "macros"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
