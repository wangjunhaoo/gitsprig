name: 问题报告
description: 报告能够复现的功能或界面问题
title: '[问题] '
body:
  - type: markdown
    attributes:
      value: '请使用演示仓库，并清除真实地址、业务代码和凭据。安全漏洞请通过 Security 页面私下报告。'
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 系统版本、CPU 架构、GitSprig 版本及 Git 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误信息或截图
      description: 仅提供与问题有关、已清除敏感信息的内容
